<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#4B2D2B">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Luxora Admin</title>
<link rel="preconnect" href="https://api.fontshare.com"><link href="https://api.fontshare.com/v2/css?f[]=general-sans@400,500,600,700&display=swap" rel="stylesheet">
<style>
:root{--ink:#4B2D2B;--cream:#FFF8F0;--bg:#F4E9DD;--card:#fff;--line:#eadbcb;--mute:#8C5B3D;--gold:#C18553;--ok:#2f7a4f;--no:#b3402a}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:400 15px/1.6 'General Sans',sans-serif}
h1,h2{font-weight:600;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.btn{background:var(--ink);color:var(--cream);border:0;border-radius:12px;padding:11px 18px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;font-size:14px;transition:background .15s}
.btn:hover{background:#6a4030}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid #e0cdbb}
.btn.ghost:hover{background:#fff}
.btn.ok{background:var(--ok);color:#fff}.btn.wait{background:#d9a441;color:#3a2200}.btn.no{background:#fff;color:var(--no);border:1.5px solid #e7b8ab}
.btn:disabled{opacity:.6}
input,select,textarea{background:#fff;border:1.5px solid #e6d5c4;border-radius:12px;padding:11px 14px;width:100%;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 4px rgba(193,133,83,.2)}
::placeholder{color:#b49a88}
#login{min-height:100vh;background:linear-gradient(165deg,#4B2D2B,#6a4030 55%,#8C5B3D);padding:10vh 18px}
.lcard{max-width:410px;margin:0 auto;background:var(--cream);border-radius:26px;padding:38px 30px;box-shadow:0 30px 70px rgba(20,8,6,.45)}
.lcard img{width:54px;height:54px;border-radius:14px;margin-bottom:18px}
.lcard h1{font-size:32px;margin-bottom:6px}
.lcard input{margin:16px 0 12px}
.shell{min-height:100vh}
.side{background:var(--ink);color:var(--cream);position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;padding:6px 8px;box-shadow:0 -8px 24px rgba(40,18,14,.25)}
.side .brand{display:none}
.side nav{display:flex;flex:1;justify-content:space-around;gap:2px}
.side .tab{flex:1;background:none;border:0;border-radius:12px;padding:10px 4px;font-size:12.5px;font-weight:500;color:#dcc8b8;cursor:pointer;text-align:center}
.side .tab.on{background:rgba(255,248,240,.14);color:var(--cream)}
.main{padding:22px 18px 100px;max-width:980px;margin:0 auto}
@media(min-width:900px){
 .shell{display:grid;grid-template-columns:250px 1fr}
 .side{position:sticky;top:0;height:100vh;flex-direction:column;gap:30px;padding:30px 18px;box-shadow:none}
 .side .brand{display:block}.side .brand img{width:150px}
 .side nav{flex-direction:column;justify-content:flex-start;gap:4px;flex:none}
 .side .tab{text-align:left;font-size:15px;padding:12px 16px;flex:none}
 .main{padding:34px 40px 60px;width:100%}
}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.top h1{font-size:clamp(28px,5vw,38px)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:22px}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px}
.stat b{display:block;font-size:30px;line-height:1.1;letter-spacing:-.02em}
.stat span{color:var(--mute);font-size:13px}
.stat.hot{background:var(--ink);color:var(--cream);border-color:var(--ink)}.stat.hot span{color:#e6cfba}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.main .tab{background:#fff;border:1.5px solid #e6d5c4;padding:8px 16px;border-radius:999px;cursor:pointer;white-space:nowrap;color:var(--mute);font-weight:500}
.main .tab.on{background:var(--ink);border-color:var(--ink);color:var(--cream)}
.main .tab b{margin-left:6px;opacity:.75}
.filters{display:grid;gap:10px;margin:16px 0 20px;grid-template-columns:1fr}
@media(min-width:700px){.filters{grid-template-columns:2fr 1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;margin-bottom:16px;padding:22px;box-shadow:0 2px 0 rgba(75,45,43,.03)}
.h{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.who{display:flex;gap:12px;align-items:center}
.av{width:44px;height:44px;border-radius:50%;background:var(--gold);color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.h b{font-size:17px}
.meta{color:var(--mute);font-size:13px}
.pill{font-size:12px;font-weight:600;padding:4px 12px;border-radius:999px;background:#f5e6d3;color:var(--mute)}
.card.approved .pill{background:#e3f2e8;color:var(--ok)}.card.waitlisted .pill{background:#fbefd2;color:#8a5a00}.card.declined .pill{background:#f8e1db;color:var(--no)}
.why{margin:16px 0 4px;white-space:pre-wrap;background:var(--cream);border-left:3px solid var(--gold);border-radius:4px 14px 14px 4px;padding:14px 16px}
.lbl{color:var(--mute);font-size:12.5px;margin-top:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chips span{background:#f5e6d3;color:var(--ink);border-radius:999px;padding:3px 12px;font-size:13px}
.more{display:none;margin-top:8px;border-top:1px solid var(--line);padding-top:6px}.more.on{display:block}
.stars{margin-top:14px}
.stars button{background:none;border:0;font-size:22px;cursor:pointer;color:#e6d5c4;padding:0 2px}.stars button.on{color:var(--gold)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.note{margin-top:14px;min-height:64px}
.empty{text-align:center;color:var(--mute);padding:70px 0;background:var(--card);border:1px dashed #e0cdbb;border-radius:22px}
#msg{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--cream);padding:12px 20px;border-radius:14px;font-weight:600;display:none;z-index:40;box-shadow:0 10px 30px rgba(40,18,14,.3)}
@media(min-width:900px){#msg{bottom:28px}}
.arow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.addrow{display:flex;gap:8px;margin-top:14px}.addrow input{flex:1}
.qr{border:1px solid var(--line);margin-top:12px;padding:14px;background:var(--cream);border-radius:16px}
.fld{display:grid;gap:5px;margin-top:12px}.fld label{font-size:13px;color:var(--mute);font-weight:500}
.chk{display:flex;gap:10px;align-items:center;margin-top:12px;cursor:pointer}.chk input{width:auto;accent-color:var(--ink)}
.iconb{padding:8px 12px}
.demo{background:#fbefd2;border:1px solid #e9c27a;border-radius:14px;padding:10px 14px;font-size:13px;margin-bottom:16px;display:none}
</style>
</head>
<body>

<div id="login"><div class="lcard">
<img src="favicon-192.png" alt="">
<h1>Luxora admin</h1>
<p class="meta">Enter your admin email and we will send you a sign-in link.</p>
<input type="email" id="em" placeholder="Admin email" autocomplete="username">
<button class="btn" id="go" style="width:100%">Email me a sign-in link</button>
<p class="meta" id="lerr" style="margin-top:12px" role="alert"></p>
</div></div>

<div id="app" style="display:none"><div class="shell">
<aside class="side">
<div class="brand"><img src="logo.png" alt="Luxora"></div>
<nav id="views"><button class="tab on" data-v="vApps">Applications</button><button class="tab" data-v="vForm">Form</button><button class="tab" data-v="vSet">Settings</button><button class="tab" id="adm">Admins</button></nav>
</aside>
<main class="main">
<div class="top"><h1>Applications</h1><div class="tools"><button class="btn ghost" id="csv">Export CSV</button><button class="btn ghost" id="out">Sign out</button></div></div>
<div class="card" id="apanel" style="display:none">
<b style="font-size:17px">Admins</b>
<div class="meta">Anyone listed here can review applications. Added admins sign in with an email link sent to the address you add.</div>
<div id="alist" style="margin-top:12px"></div>
<div class="addrow"><input type="email" id="aem" placeholder="New admin email"><button class="btn" id="aadd">Add admin</button></div>
<div class="meta" id="ainfo" style="margin-top:10px" role="status"></div>
</div>
<div class="demo" id="demo">Demo mode: showing sample data. Add FIREBASE_CONFIG to use real applications.</div>
<div id="vApps"><div class="stats" id="stats"></div><div class="tabs" id="tabs"></div>
<div class="filters">
<input type="search" id="q" placeholder="Search name, email, country, goal">
<select id="fage"><option value="">All ages</option><option>13–17</option><option>18–24</option><option>25–30</option><option>31–40</option><option>41+</option></select>
<select id="farea"><option value="">All growth areas</option></select>
</div>
<div id="list"></div></div>
<div id="vForm" style="display:none"><div id="fbody"></div></div>
<div id="vSet" style="display:none"><div id="sbody"></div></div>
</main></div></div>
<div id="msg"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-auth-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-firestore-compat.min.js"></script>
<script>
// Use the same Firebase web config as index.html
var FIREBASE_CONFIG = {
  apiKey: "AIzaSyCJ3zfZTdylHCev8ucrtOM-ljpKBMt9RhE",
  authDomain: "luxoria-99c72.firebaseapp.com",
  projectId: "luxoria-99c72",
  storageBucket: "luxoria-99c72.firebasestorage.app",
  messagingSenderId: "620801847493",
  appId: "1:620801847493:web:87eabd3c844c7418afc0ac"
};
var COL = 'luxora_applications';

var db=null, auth=null, apps=[], tab='pending';
var STATUSES=['pending','approved','waitlisted','declined'];
var LABEL={pending:'Pending',approved:'Approved',waitlisted:'Waitlisted',declined:'Declined'};
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(t){var m=$('msg');m.textContent=t;m.style.display='block';setTimeout(function(){m.style.display='none'},1800)}

var SAMPLE=[{id:'s1',name:'Amara Okoye',email:'amara@example.com',whatsapp:'+2348012345678',gender:'Female',age:'25–30',country:'Nigeria',city:'Lagos',status:'Entrepreneur / Freelancer',active:'Evening',goal:'Launch my first product',why:'I have been building alone for two years and I keep dropping my own plans. I want to be around people who execute and hold each other to a standard.',blocker:'Inconsistency and overthinking.',areas:['Consistency, discipline and daily systems','Career clarity and skill positioning'],outcome:'Ship my product in 90 days',ready:'5',hours:'3–5 hours',contribute:'Design feedback and accountability.',before:'No',heard:'Instagram',referredBy:'',status_review:'pending',adminNote:'',rating:0,createdAt:new Date().toISOString()}];

if(FIREBASE_CONFIG){firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();auth=firebase.auth()}

function start(){
  $('login').style.display='none';$('app').style.display='block';loadConfig();
  if(!db){$('demo').style.display='block';apps=SAMPLE;render();return}
  db.collection(COL).orderBy('createdAt','desc').onSnapshot(function(s){
    apps=s.docs.map(function(d){var x=d.data();x.id=d.id;return x});render();
  },function(e){console.error(e);toast('Could not load applications')});
}
var me=null,admins=[],adminsOn=false;
function showLogin(msg){$('login').style.display='block';$('app').style.display='none';$('lerr').style.color='var(--no)';$('lerr').textContent=msg||''}
function denyAccess(){auth.signOut();showLogin("This email does not have admin access. Ask an existing admin to add you.")}
var LINK_URL=location.origin+location.pathname;
if(auth){
  if(auth.isSignInWithEmailLink(location.href)){
    var le=localStorage.getItem('luxAdminEmail')||window.prompt('Confirm your email to finish signing in');
    if(le)auth.signInWithEmailLink(le.trim(),location.href).then(function(){localStorage.removeItem('luxAdminEmail')}).catch(function(){showLogin('That sign-in link has expired or was already used. Request a new one.')});
    history.replaceState(null,'',location.pathname);
  }
  auth.onAuthStateChanged(function(u){
    if(!u){showLogin();return}
    var id=(u.email||'').toLowerCase();
    db.collection('admins').doc(id).get().then(function(d){
      if(!d.exists)return denyAccess();
      me=d.data();me.email=id;start();
    }).catch(function(){denyAccess()});
  });
}
$('go').onclick=function(){
  var e=$('em').value.trim().toLowerCase();
  if(!/^\S+@\S+\.\S+$/.test(e)){$('lerr').textContent='Enter a valid email address.';return}
  $('go').disabled=true;
  auth.sendSignInLinkToEmail(e,{url:LINK_URL,handleCodeInApp:true}).then(function(){
    localStorage.setItem('luxAdminEmail',e);
    $('lerr').style.color='var(--ok)';$('lerr').textContent='Link sent. Open it on this device to sign in. Check spam if you do not see it.';
  }).catch(function(){$('lerr').style.color='var(--no)';$('lerr').textContent='Could not send the link. Check the email and try again.'}).then(function(){$('go').disabled=false});
};
$('out').onclick=function(){auth?auth.signOut():location.reload()};

// ---- admins management ----
function loadAdmins(){
  if(adminsOn||!db)return;adminsOn=true;
  db.collection('admins').orderBy('addedAt').onSnapshot(function(s){admins=s.docs.map(function(d){return d.data()});renderAdmins()},function(){toast('Could not load admins')});
}
function renderAdmins(){
  $('alist').innerHTML=admins.map(function(a){
    var canRm=me&&me.role==='owner'&&a.role!=='owner';
    return '<div class="arow"><div><b>'+esc(a.email)+'</b><div class="meta">'+(a.role==='owner'?'Owner':'Admin')+(a.addedBy?' · added by '+esc(a.addedBy):'')+'</div></div>'+(canRm?'<button class="btn ghost" data-rm="'+esc(a.email)+'">Remove</button>':'')+'</div>';
  }).join('');
}
$('adm').onclick=function(){var p=$('apanel');p.style.display=p.style.display==='none'?'block':'none';if(p.style.display==='block')loadAdmins()};
$('aadd').onclick=function(){
  var e=$('aem').value.trim().toLowerCase(),info=$('ainfo');
  if(!/^\S+@\S+\.\S+$/.test(e)){info.textContent='Enter a valid email address.';return}
  if(admins.some(function(a){return a.email===e})){info.textContent='That email is already an admin.';return}
  db.collection('admins').doc(e).set({email:e,role:'admin',addedBy:me.email,addedAt:new Date().toISOString()}).then(function(){
    $('aem').value='';
    var body='You have been added as an admin on the Luxora Circle dashboard.\n\nOpen '+LINK_URL+' , enter this email address and choose "Email me a sign-in link".';
    info.innerHTML='Added '+esc(e)+'. <a style="color:var(--gold)" href="mailto:'+encodeURIComponent(e)+'?subject='+encodeURIComponent('Luxora admin access')+'&body='+encodeURIComponent(body)+'">Send them an invite email</a>';
  }).catch(function(){info.textContent='Could not add that admin. Check your connection and permissions.'});
};
document.addEventListener('click',function(e){
  var em=e.target.dataset&&e.target.dataset.rm;if(!em)return;
  if(confirm('Remove '+em+' as an admin? They will lose access immediately.'))db.collection('admins').doc(em).delete().then(function(){toast('Admin removed')}).catch(function(){toast('Could not remove admin')});
});

var DEFAULT_FORM={"sections": [{"id": "s1", "title": "About you", "heading": "First, who are you?", "questions": [{"id": "name", "label": "Full name", "type": "text", "required": true, "on": true, "half": true}, {"id": "email", "label": "Email address", "type": "email", "required": true, "on": true, "half": true}, {"id": "whatsapp", "label": "WhatsApp number", "type": "tel", "required": true, "on": true, "hint": "Include your country code, e.g. +234", "placeholder": "+234 801 234 5678"}, {"id": "gender", "label": "Gender", "type": "radio", "required": true, "on": true, "options": ["Female", "Male"], "half": true}, {"id": "age", "label": "Age", "type": "select", "required": true, "on": true, "options": ["13–17", "18–24", "25–30", "31–40", "41+"], "half": true}, {"id": "country", "label": "Country", "type": "text", "required": true, "on": true, "half": true}, {"id": "city", "label": "City", "type": "text", "required": true, "on": true, "half": true}, {"id": "status", "label": "Current status", "type": "select", "required": true, "on": true, "options": ["Secondary School Student", "Undergraduate Student", "Graduate", "Employed / Working Professional", "Entrepreneur / Freelancer", "Other"]}, {"id": "active", "label": "When are you most active on WhatsApp?", "type": "radio", "required": true, "on": true, "options": ["Morning (8:00 AM – 10:00 AM)", "Afternoon (1:00 PM – 3:00 PM)", "Evening (7:00 PM – 10:00 PM)", "Late night (after 10:00 PM)"]}]}, {"id": "s2", "title": "Intent and alignment", "heading": "What brings you to Luxora?", "questions": [{"id": "goal", "label": "What is your biggest goal in this season of your life?", "type": "text", "required": true, "on": true}, {"id": "why", "label": "Why do you want to join the Luxora Circle right now?", "type": "textarea", "required": true, "on": true, "hint": "Take your time. Write at least 150 characters.", "minChars": 150}, {"id": "blocker", "label": "What has stopped you from growing so far?", "type": "textarea", "required": true, "on": true}, {"id": "areas", "label": "Where do you need the most growth and support?", "type": "checkbox", "required": true, "on": true, "hint": "Choose 2", "min": 2, "max": 2, "options": ["Personal identity, mindset and unlearning old habits", "Career clarity and skill positioning", "Consistency, discipline and daily systems", "Spiritual alignment and purpose", "Relationships and emotional intelligence", "Health, fitness and wellbeing", "Finance and wealth habits"]}, {"id": "outcome", "label": "What ONE specific outcome do you want from this community?", "type": "text", "required": true, "on": true}]}, {"id": "s3", "title": "Commitment", "heading": "Are you ready to show up?", "questions": [{"id": "ready", "label": "Luxora is built on participation and execution. How ready are you to show up, contribute and engage weekly?", "type": "scale", "required": true, "on": true, "hint": "1 is not ready, 5 is fully ready"}, {"id": "hours", "label": "How many hours a week can you give to the Circle?", "type": "select", "required": true, "on": true, "options": ["1–2 hours", "3–5 hours", "6+ hours"]}, {"id": "contribute", "label": "What can you contribute to the Circle?", "type": "textarea", "required": true, "on": true, "hint": "A skill, a gift, a perspective, a habit you can model"}, {"id": "before", "label": "Have you been part of a community like this before?", "type": "radio", "required": true, "on": true, "options": ["Yes", "No"]}, {"id": "heard", "label": "How did you hear about Luxora Circle?", "type": "select", "required": true, "on": true, "options": ["WhatsApp", "Instagram", "X / Twitter", "TikTok", "A friend or member", "Other"], "half": true}, {"id": "referredBy", "label": "Referred by", "type": "text", "required": false, "on": true, "half": true}, {"id": "commit_weekly", "label": "I commit to showing up weekly.", "type": "agree", "required": true, "on": true}, {"id": "agree_rules", "label": "I agree to respect other members, keep what is shared confidential and not spam the Circle.", "type": "agree", "required": true, "on": true}]}]};
var DEFAULTS={"open": true, "closedMessage": "Applications are closed right now. Check back soon.", "heroTitle": "Awaken to who you are. Become who you choose to be.", "heroText": "Luxora Circle is a members-only community for people who are intentionally becoming. We show up weekly, we do the work, and we grow together.", "groupLink": "", "tplApproved": "Hi {name}, welcome to the Luxora Circle! Your application has been approved. Join the community here: {link}\n\nWe are glad to have you. Show up, contribute and grow with us.", "tplWaitlist": "Hi {name}, thank you for applying to the Luxora Circle. We loved your application and have placed you on our waitlist. We will message you as soon as a place opens.", "tplDecline": "Hi {name}, thank you for applying to the Luxora Circle and for the time you put into your answers. We are not able to offer you a place right now. You are welcome to apply again in future."};
var form=null,settings=null,openQ={},fDirty=false,sDirty=false;
var TYPES={text:'Short answer',textarea:'Long answer',email:'Email',tel:'Phone number',select:'Dropdown',radio:'Single choice',checkbox:'Multiple choice',scale:'Scale 1 to 5',agree:'Agreement checkbox'};
var CORE={name:1,email:1,whatsapp:1};
function clone(o){return JSON.parse(JSON.stringify(o))}
function nid(){return 'q_'+Math.random().toString(36).slice(2,8)}
function loadConfig(){
  if(form)return;
  if(!db){form=clone(DEFAULT_FORM);settings=clone(DEFAULTS);renderForm();renderSet();return}
  Promise.all([db.collection('config').doc('form').get(),db.collection('config').doc('settings').get()]).then(function(r){
    form=r[0].exists?r[0].data():clone(DEFAULT_FORM);
    settings=Object.assign(clone(DEFAULTS),r[1].exists?r[1].data():{});
    renderForm();renderSet();render();
  }).catch(function(){toast('Could not load form settings')});
}
function chk(k,v,dis,txt,at){return '<label class="chk"><input type="checkbox" data-qf="'+k+'"'+at+(v?' checked':'')+(dis?' disabled':'')+'> '+txt+'</label>'}
function fld(k,lab,val,at,extra){return '<div class="fld"><label>'+lab+'</label><input data-qf="'+k+'"'+at+' value="'+esc(val)+'"'+(extra||'')+'></div>'}
function qrow(si,q,qi){
  var core=CORE[q.id],op=openQ[q.id],at=' data-si="'+si+'" data-qi="'+qi+'"',t=q.type;
  var h='<div class="qr"><div class="h"><div><b>'+esc(q.label||'Untitled')+'</b><div class="meta">'+TYPES[t]+(q.required?' · required':' · optional')+(q.on===false?' · hidden':'')+'</div></div><div class="acts" style="margin:0">'
   +'<button class="btn ghost iconb" data-fx="qmove" data-dir="-1"'+at+' aria-label="Move up">↑</button><button class="btn ghost iconb" data-fx="qmove" data-dir="1"'+at+' aria-label="Move down">↓</button>'
   +'<button class="btn ghost iconb" data-fx="qedit"'+at+'>'+(op?'Done':'Edit')+'</button>'+(core?'':'<button class="btn ghost iconb" data-fx="qdel"'+at+'>Delete</button>')+'</div></div>';
  if(op){
    h+=fld('label','Question',q.label,at)+fld('hint','Hint (optional)',q.hint||'',at)
     +'<div class="fld"><label>Answer type</label><select data-qf="type"'+at+(core?' disabled':'')+'>'+Object.keys(TYPES).map(function(k){return '<option value="'+k+'"'+(k===t?' selected':'')+'>'+TYPES[k]+'</option>'}).join('')+'</select></div>';
    if(/^(text|email|tel|textarea)$/.test(t))h+=fld('placeholder','Placeholder (optional)',q.placeholder||'',at);
    if(/^(select|radio|checkbox)$/.test(t))h+='<div class="fld"><label>Options (one per line)</label><textarea data-qf="options"'+at+' style="min-height:110px">'+esc((q.options||[]).join('\n'))+'</textarea></div>';
    if(t==='checkbox')h+=fld('min','Minimum to choose (0 for none)',q.min||0,at,' type="number" min="0"')+fld('max','Maximum to choose (0 for no limit)',q.max||0,at,' type="number" min="0"');
    if(t==='textarea')h+=fld('minChars','Minimum characters (0 for none)',q.minChars||0,at,' type="number" min="0"');
    h+=chk('required',q.required||core,core,'Required',at)+chk('on',q.on!==false,core,'Visible to applicants',at)+(/^(text|email|tel|select)$/.test(t)?chk('half',!!q.half,false,'Half width (sits beside the next half-width question)',at):'');
  }
  return h+'</div>';
}
function renderForm(){
  var h='<div class="card"><div class="h"><div><b style="font-size:17px">Form questions</b><div class="meta">Changes go live for applicants when you save.</div></div><div class="acts" style="margin:0"><button class="btn ghost" data-fx="reset">Reset to default</button><button class="btn" data-fx="save">Save and publish</button></div></div><div class="meta" id="fdirty" style="margin-top:8px">'+(fDirty?'Unsaved changes':'')+'</div></div>';
  form.sections.forEach(function(s,si){
    h+='<div class="card"><div class="meta">Step '+(si+1)+'</div><div class="fld"><label>Step name</label><input data-sf="title" data-si="'+si+'" value="'+esc(s.title)+'"></div><div class="fld"><label>Headline shown to applicants</label><input data-sf="heading" data-si="'+si+'" value="'+esc(s.heading||'')+'"></div>';
    s.questions.forEach(function(q,qi){h+=qrow(si,q,qi)});
    h+='<div class="acts"><button class="btn ghost" data-fx="addq" data-si="'+si+'">+ Add question</button><button class="btn ghost iconb" data-fx="smove" data-dir="-1" data-si="'+si+'">Step ↑</button><button class="btn ghost iconb" data-fx="smove" data-dir="1" data-si="'+si+'">Step ↓</button>'+(form.sections.length>1?'<button class="btn ghost iconb" data-fx="sdel" data-si="'+si+'">Delete step</button>':'')+'</div></div>';
  });
  $('fbody').innerHTML=h+'<button class="btn ghost" data-fx="adds">+ Add step</button>';
}
function markF(){fDirty=true;var e=$('fdirty');if(e)e.textContent='Unsaved changes'}
function renderSet(){
  var s=settings;
  function fl(k,lab,ta,hint){return '<div class="fld"><label>'+lab+'</label>'+(ta?'<textarea data-set="'+k+'" style="min-height:90px">'+esc(s[k])+'</textarea>':'<input data-set="'+k+'" value="'+esc(s[k])+'">')+(hint?'<div class="meta">'+hint+'</div>':'')+'</div>'}
  $('sbody').innerHTML='<div class="card"><b>Applications</b><label class="chk"><input type="checkbox" data-set="open"'+(s.open!==false?' checked':'')+'> Accepting applications</label>'+fl('closedMessage','Message shown when closed',1)+'</div>'
   +'<div class="card"><b>Landing page</b>'+fl('heroTitle','Headline')+fl('heroText','Intro text',1)+'</div>'
   +'<div class="card"><b>WhatsApp messages</b>'+fl('groupLink','Group invite link')+fl('tplApproved','Approved message',1,'Use {name} for the first name and {link} for the group link.')+fl('tplWaitlist','Waitlist message',1)+fl('tplDecline','Decline message',1)+'</div>'
   +'<button class="btn" data-fx="sset">Save settings</button> <span class="meta" id="sdirty">'+(sDirty?'Unsaved changes':'')+'</span>';
}
function checkForm(){
  for(var i=0;i<form.sections.length;i++){
    var s=form.sections[i],vis=0;
    if(!(s.title||'').trim())return 'Give step '+(i+1)+' a name.';
    for(var j=0;j<s.questions.length;j++){
      var q=s.questions[j];
      if(!(q.label||'').trim())return 'Every question needs text (step '+(i+1)+').';
      if(/^(select|radio|checkbox)$/.test(q.type)&&(q.options||[]).length<2)return '"'+q.label+'" needs at least 2 options.';
      if(q.type==='checkbox'){if(q.max&&q.min>q.max)return 'On "'+q.label+'" the minimum is higher than the maximum.';if(q.max&&q.max>q.options.length)return 'On "'+q.label+'" the maximum is more than the number of options.'}
      if(CORE[q.id]){q.required=true;q.on=true}
      if(q.on!==false)vis++;
    }
    if(!vis)return 'Step "'+s.title+'" has no visible questions.';
  }
  return '';
}
function mv(a,i,d){var j=i+d;if(j<0||j>=a.length)return;var x=a[i];a[i]=a[j];a[j]=x}
document.addEventListener('click',function(e){
  var t=e.target,d=t.dataset;
  if(d.v){['vApps','vForm','vSet'].forEach(function(id){$(id).style.display=id===d.v?'block':'none'});[].forEach.call(document.querySelectorAll('#views .tab'),function(b){b.classList.toggle('on',b===t)});document.querySelector('.top h1').textContent=d.v==='vApps'?'Applications':d.v==='vForm'?'Form':'Settings';return}
  var fx=d.fx;if(!fx)return;
  var si=+d.si,qi=+d.qi,secs=form&&form.sections;
  if(fx==='sset'){
    if(!db){toast('Demo mode');return}
    db.collection('config').doc('settings').set(clone(settings)).then(function(){sDirty=false;$('sdirty').textContent='';toast('Settings saved')}).catch(function(){toast('Could not save settings')});return;
  }
  if(!form)return;
  if(fx==='save'){
    var m=checkForm();if(m){toast(m);return}
    if(!db){toast('Demo mode');return}
    var out=clone(form);out.updatedAt=new Date().toISOString();out.updatedBy=me.email;
    db.collection('config').doc('form').set(out).then(function(){fDirty=false;renderForm();toast('Form published')}).catch(function(){toast('Could not save the form')});return;
  }
  if(fx==='reset'){if(confirm('Replace the form with the original default questions? This is not saved until you click Save and publish.')){form=clone(DEFAULT_FORM);fDirty=true;renderForm()}return}
  if(fx==='addq'){var q={id:nid(),label:'New question',hint:'',type:'text',required:true,options:[],on:true};secs[si].questions.push(q);openQ[q.id]=1}
  else if(fx==='qmove')mv(secs[si].questions,qi,+d.dir);
  else if(fx==='qedit'){var id=secs[si].questions[qi].id;openQ[id]=!openQ[id];renderForm();return}
  else if(fx==='qdel'){if(!confirm('Delete this question? Answers already submitted are kept.'))return;secs[si].questions.splice(qi,1)}
  else if(fx==='smove')mv(secs,si,+d.dir);
  else if(fx==='sdel'){if(!confirm('Delete this whole step and its questions?'))return;secs.splice(si,1)}
  else if(fx==='adds')secs.push({id:'s_'+nid(),title:'New step',heading:'',questions:[]});
  else return;
  fDirty=true;renderForm();
});
$('fbody').addEventListener('input',function(e){
  var t=e.target,d=t.dataset;
  if(d.sf){form.sections[+d.si][d.sf]=t.value;markF();return}
  if(!d.qf)return;
  var q=form.sections[+d.si].questions[+d.qi],k=d.qf;
  if(k==='options')q.options=t.value.split('\n').map(function(x){return x.trim()}).filter(Boolean);
  else if(k==='min'||k==='max'||k==='minChars')q[k]=Math.max(0,parseInt(t.value,10)||0);
  else if(t.type==='checkbox')q[k]=t.checked;
  else q[k]=t.value;
  markF();
  if(k==='type'){if(/^(select|radio|checkbox)$/.test(q.type)&&!(q.options||[]).length)q.options=['Option 1','Option 2'];renderForm()}
});
$('sbody').addEventListener('input',function(e){
  var t=e.target,k=t.dataset.set;if(!k)return;
  settings[k]=t.type==='checkbox'?t.checked:t.value;sDirty=true;$('sdirty').textContent='Unsaved changes';
});
function tpl(a){
  var s=settings||DEFAULTS,s0=st(a),k=s0==='approved'?'tplApproved':s0==='waitlisted'?'tplWaitlist':'tplDecline';
  return String(s[k]||DEFAULTS[k]).replace(/\{name\}/g,(a.name||'').split(' ')[0]).replace(/\{link\}/g,s.groupLink||'[add your group link in Settings]');
}
function extras(a,row){return Object.keys(a.labels||{}).map(function(k){var v=a[k];if(Array.isArray(v))v=v.join(', ');if(v===true)v='Yes';if(v===false)v='No';return row(a.labels[k],v)}).join('')}

function st(a){return a.status_review||'pending'}
function render(){
  var counts={all:apps.length};STATUSES.forEach(function(s){counts[s]=apps.filter(function(a){return st(a)===s}).length});
  $('tabs').innerHTML=STATUSES.map(function(s){return '<button class="tab'+(tab===s?' on':'')+'" data-t="'+s+'">'+LABEL[s]+'<b>'+counts[s]+'</b></button>'}).join('')+'<button class="tab'+(tab==='all'?' on':'')+'" data-t="all">All<b>'+counts.all+'</b></button>';
  $('stats').innerHTML=[['Total',counts.all],['Pending',counts.pending,1],['Approved',counts.approved],['Waitlisted',counts.waitlisted]].map(function(x){return '<div class="stat'+(x[2]?' hot':'')+'"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>'}).join('');
  var areas={};apps.forEach(function(a){(a.areas||[]).forEach(function(x){areas[x]=1})});
  var sel=$('farea'),cv=sel.value;
  if(sel.options.length-1!==Object.keys(areas).length){sel.innerHTML='<option value="">All growth areas</option>'+Object.keys(areas).map(function(x){return '<option>'+esc(x)+'</option>'}).join('');sel.value=cv}
  var q=$('q').value.toLowerCase(),ag=$('fage').value,ar=sel.value;
  var rows=apps.filter(function(a){
    if(tab!=='all'&&st(a)!==tab)return false;
    if(ag&&a.age!==ag)return false;
    if(ar&&(a.areas||[]).indexOf(ar)<0)return false;
    return !q||[a.name,a.email,a.country,a.city,a.goal,a.outcome].join(' ').toLowerCase().indexOf(q)>=0;
  });
  $('list').innerHTML=rows.length?rows.map(card).join(''):'<div class="empty">No applications here yet.</div>';
}
function card(a){
  var s=st(a),r=+a.rating||0,stars='';
  for(var i=1;i<=5;i++)stars+='<button data-star="'+i+'" data-id="'+esc(a.id)+'" class="'+(i<=r?'on':'')+'" aria-label="Rate '+i+'">★</button>';
  var date=a.createdAt?new Date(a.createdAt).toLocaleDateString():'';
  function row(k,v){return v?'<div class="lbl">'+k+'</div><div>'+esc(v)+'</div>':''}
  return '<div class="card '+s+'"><div class="h"><div class="who"><div class="av">'+esc((a.name||'?').split(' ').map(function(w){return w[0]||''}).slice(0,2).join('').toUpperCase())+'</div><div><b>'+esc(a.name)+'</b><div class="meta">'+esc(a.age)+' · '+esc(a.gender)+' · '+esc(a.city)+', '+esc(a.country)+' · '+esc(date)+'</div></div></div><span class="pill">'+LABEL[s]+'</span></div>'
  +(a.why?'<div class="why">'+esc(a.why)+'</div>':'')
  +'<div class="chips">'+(a.areas||[]).map(function(x){return '<span>'+esc(x)+'</span>'}).join('')+'</div>'
  +row('Goal',a.goal)+row('Outcome wanted',a.outcome)
  +'<div class="more" id="m-'+esc(a.id)+'">'+row('What has stopped them',a.blocker)+row('Can contribute',a.contribute)+row('Status',a.status)+row('Readiness (1–5)',a.ready)+row('Hours per week',a.hours)+row('Most active on WhatsApp',a.active)+row('Community before',a.before)+row('Heard via',a.heard+(a.referredBy?' (referred by '+a.referredBy+')':''))+row('Email',a.email)+row('WhatsApp',a.whatsapp)+extras(a,row)+'</div>'
  +'<div class="stars">'+stars+'</div>'
  +'<textarea class="note" data-note="'+esc(a.id)+'" placeholder="Admin note (saves when you click away)">'+esc(a.adminNote||'')+'</textarea>'
  +'<div class="acts"><button class="btn ok" data-set="approved" data-id="'+esc(a.id)+'">Approve</button><button class="btn wait" data-set="waitlisted" data-id="'+esc(a.id)+'">Waitlist</button><button class="btn no" data-set="declined" data-id="'+esc(a.id)+'">Decline</button>'
  +(s!=='pending'?'<button class="btn ghost" data-set="pending" data-id="'+esc(a.id)+'">Reset</button>':'')
  +'<button class="btn ghost" data-more="'+esc(a.id)+'">Details</button>'
  +(s!=='pending'?'<a class="btn" target="_blank" rel="noopener" href="'+wa(a)+'">Message on WhatsApp</a>':'')
  +'</div></div>';
}
function wa(a){return 'https://wa.me/'+String(a.whatsapp||'').replace(/\D/g,'')+'?text='+encodeURIComponent(tpl(a))}
function save(id,patch){
  var a=apps.filter(function(x){return x.id===id})[0];if(!a)return;
  for(var k in patch)a[k]=patch[k];
  if(db)db.collection(COL).doc(id).update(patch).catch(function(){toast('Save failed. Check your connection.')});
  render();
}
document.addEventListener('click',function(e){
  var t=e.target;
  if(t.dataset.t){tab=t.dataset.t;render()}
  else if(t.dataset.set){save(t.dataset.id,{status_review:t.dataset.set});toast(LABEL[t.dataset.set])}
  else if(t.dataset.star){var a=apps.filter(function(x){return x.id===t.dataset.id})[0];save(t.dataset.id,{rating:+a.rating===+t.dataset.star?0:+t.dataset.star})}
  else if(t.dataset.more){$('m-'+t.dataset.more).classList.toggle('on')}
});
document.addEventListener('focusout',function(e){
  var id=e.target.dataset&&e.target.dataset.note;if(!id)return;
  var a=apps.filter(function(x){return x.id===id})[0];
  if(a&&a.adminNote!==e.target.value){a.adminNote=e.target.value;if(db)db.collection(COL).doc(id).update({adminNote:e.target.value});toast('Note saved')}
});
['q','fage','farea'].forEach(function(i){$(i).addEventListener('input',render)});

$('csv').onclick=function(){
  var base=['createdAt','status_review','rating','name','email','whatsapp','gender','age','country','city','status','active','goal','why','blocker','areas','outcome','ready','hours','contribute','before','heard','referredBy'],ex={};
  apps.forEach(function(a){Object.keys(a).forEach(function(k){if(base.indexOf(k)<0&&k!=='id'&&k!=='labels'&&k!=='adminNote')ex[k]=1})});
  var cols=base.concat(Object.keys(ex),['adminNote']);
  function c(v){v=Array.isArray(v)?v.join('; '):(v==null?'':String(v));if(/^[=+\-@]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}
  var csv=[cols.join(',')].concat(apps.map(function(a){return cols.map(function(k){return c(a[k])}).join(',')})).join('\n');
  var l=document.createElement('a');l.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));l.download='luxora-applications.csv';l.click();
};
</script>
</body>
</html>
